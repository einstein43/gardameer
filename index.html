<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gardameer</title>
<meta name="description" content="Interactieve gids voor het Gardameer: SVG-kaart, pins, vijf dingen per stad."/>
<meta name="theme-color" content="#1F6F86"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#efe8dc; --surface:#f7f2e8; --surface-2:#ebe3d4; --ink:#1c2628;
  --muted:#5c676a; --faint:#8a8480; --water:#1f6f86; --water-deep:#13485a;
  --water-soft:#d5e6ea; --land:#d4c6af; --pin:#b23a2f; --line:rgba(28,38,40,.12);
  --font-display:"Fraunces","Iowan Old Style",Palatino,serif;
  --font-sans:"Figtree","Segoe UI",system-ui,sans-serif;
  --shadow: 0 0 0 1px rgba(28,38,40,.06), 0 1px 2px -1px rgba(28,38,40,.06), 0 8px 24px -12px rgba(28,38,40,.12);
}
* { box-sizing:border-box }
html { -webkit-font-smoothing:antialiased }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-sans); line-height:1.5 }
button { font:inherit; color:inherit; cursor:pointer }
h1,h2,h3 { text-wrap:balance; font-family:var(--font-display); font-weight:500; letter-spacing:-.02em }
p { text-wrap:pretty }
.header { border-bottom:1px solid var(--line); padding:24px 32px }
.kicker { margin:0; font-size:14px; font-weight:500; color:var(--water); letter-spacing:.04em }
h1 { margin:8px 0 0; font-size:clamp(2rem,4vw,3rem); line-height:1.1 }
.lede { margin:8px 0 0; max-width:36rem; color:var(--muted) }
.meta { margin:0; font-size:14px; color:var(--faint) }
.row { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between }
.layout { display:grid }
@media (min-width:900px) { .layout { grid-template-columns:1.05fr .95fr } .map-wrap { border-right:1px solid var(--line); border-bottom:none } }
.map-wrap { border-bottom:1px solid var(--line); padding:16px 24px }
svg { width:100%; height:auto; max-width:32rem; display:block; margin:0 auto }
.filters { display:flex; flex-wrap:wrap; gap:8px; padding:16px 24px; border-bottom:1px solid var(--line) }
.chip { height:44px; border:0; border-radius:999px; padding:0 16px; font-size:14px; font-weight:500; background:var(--surface); box-shadow:var(--shadow) }
.chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); box-shadow:none }
.list { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); margin:0; padding:0; list-style:none }
.list button { width:100%; min-height:64px; border:0; background:var(--bg); text-align:left; padding:12px 16px; display:flex; flex-direction:column; justify-content:center }
.list button:hover { background:var(--surface) }
.list button.active { background:var(--water-soft) }
.list .name { font-weight:500 }
.list .sub { font-size:14px; color:var(--muted) }
.detail { padding:24px; border-top:1px solid var(--line); scroll-margin-top:16px }
.detail h2 { margin:4px 0 0; font-size:clamp(1.6rem,3vw,2rem) }
.detail .tag { margin:4px 0 0; color:var(--muted) }
ol { margin:24px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:16px }
ol li { display:flex; gap:16px }
.num { width:32px; height:32px; border-radius:999px; background:var(--surface-2); color:var(--water); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:14px; flex-shrink:0 }
.note { margin:4px 0 0; font-size:14px; color:var(--muted) }
@media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important } }
</style>
</head>
<body>
<header class="header">
  <p class="kicker">Lago di Garda</p>
  <div class="row">
    <div>
      <h1>Gardameer</h1>
      <p class="lede">Zestien steden op de oever. Tik een pin of een naam — vijf dingen die de stad de moeite waard maken.</p>
    </div>
    <p class="meta">16 steden · geen tiles, geen Leaflet</p>
  </div>
</header>
<div class="layout">
  <section class="map-wrap">
    <svg viewBox="0 0 440 666.61" role="img" aria-label="Kaart van het Gardameer met steden als pins" id="map"></svg>
  </section>
  <section>
    <div class="filters" id="filters"></div>
    <ul class="list" id="list"></ul>
    <article class="detail" id="detail"></article>
  </section>
</div>
<script>
const TOWNS = [{"id": "riva", "name": "Riva del Garda", "shore": "noord", "tag": "Wind & bergen", "x": 345.4, "y": 54, "labelSide": "left", "things": [{"title": "Piazza III Novembre", "note": "Het waterplein met de Rocca, palazzi en de kerk — het gezicht van Riva."}, {"title": "Ponale-pad", "note": "Klifpad in de oude militaire weg, naar Pregasina met uitzicht op het smalle noorden."}, {"title": "Wind- en kitesurfen", "note": "De ochtend-Peler en middag-Ora maken van Riva een van de beste spots van Europa."}, {"title": "Lago di Tenno", "note": "Turkoois bergmeer, twintig minuten omhoog. Helder, koel, bijna onwerkelijk."}, {"title": "Bastione", "note": "Vesting boven de stad. Te voet via de trap of met de tunnel-lift."}]}, {"id": "torbole", "name": "Torbole", "shore": "noord", "tag": "Surfhoofdstad", "x": 384, "y": 82.3, "labelSide": "right", "things": [{"title": "Windsurfen", "note": "Wereldbekend om de Peler. Scholen, verhuur en races pal voor de promenade."}, {"title": "Spiaggia di Torbole", "note": "Kiezelstrand met zicht op de Brenta. Vroeg komen voor een plek in de luwte."}, {"title": "Centro storico", "note": "Smalle steegjes tot aan de oever, visrestaurants en een stille kerk."}, {"title": "Castel Penede", "note": "Ruïne boven Nago. Korte klim, breed uitzicht over Torbole en het meer."}, {"title": "Mountainbiken", "note": "Trails naar Monte Velo en de old Ponale — Torbole is ook een bike-dorp."}]}, {"id": "limone", "name": "Limone sul Garda", "shore": "west", "tag": "Citroenterrassen", "x": 292, "y": 153.9, "labelSide": "left", "things": [{"title": "Limonaia del Castèl", "note": "Historische citroenserres tegen de klif. Dit dorp gaf de limone zijn naam."}, {"title": "Ciclopista del Garda", "note": "Houten fietsbrug langs de rotswand — het mooiste stuk van de westelijke fietsroute."}, {"title": "Centro storico", "note": "Trappen, lemon-winkels en balkons boven het water. Kom te voet, de auto blijft buiten."}, {"title": "Olijfgaarden", "note": "Korte klim boven  "things": [{"title": "Bardolino DOC", "note": "Lichte rode wijn en de rosé Chiaretto. De heuvels achter het dorp staan vol ranken."}, {"title": "Museo del Vino Zeni", "note": "Wijnmuseum én cantina. Proeven, daarna de Strada del Vino fietsen."}, {"title": "San Severo", "note": "Romaanse kerk met fresco's, even buiten het centrum in Cisano-richting."}, {"title": "Lungolago", "note": "Promenade met gelato, boten en zicht op het brede zuiden."}, {"title": "Olive Oil Museum", "note": "In Cisano: hoe de Garda-olijf hier al eeuwen wordt geperst."}]}, {"id": "lazise", "name": "Lazise", "shore": "oost", "tag": "Ommuurde haven", "x": 266, "y": 524.3, "labelSide": "right", "things": [{"title": "Castello Scaligero", "note": "Kasteel en complete stadsmuur. Lazise is een van de weinige écht ommuurde oeversteden."}, {"title": "Porto Vecchio", "note": "Binnenhaven binnen de muren. Avondlicht, vis, geen auto's."}, {"title": "Mura veneziane", "note": "Wandel over de Venetiaanse muur, van de Dogana naar de noordpoort."}, {"title": "Piazza Vittorio Emanuele", "note": "Het hart achter de poort: cafés, markt, de kerk van San Nicolò."}, {"title": "Canevaworld", "note": "Waterpark en Movieland, vijf minuten buiten het centrum — niet voor iedereen, wel dichtbij."}]}, {"id": "sirmione", "name": "Sirmione", "shore": "zuid", "tag": "Schiereiland", "x": 144.8, "y": 538.7, "labelSide": "left", "things": [{"title": "Grotte di Catullo", "note": "Romeinse villa op de punt van het schiereiland. Catullus' naam, keizerlijke schaal."}, {"title": "Rocca Scaligera", "note": "Kasteel met ophaalbrug en haven erin. De poort naar het oude Sirmione."}, {"title": "Terme di Sirmione", "note": "Zwavelbronnen in het meer. Kuuroord sinds de Romeinen, nu Aquaria en het hotel."}, {"title": "Centro storico", "note": "Schiereiland zonder auto's. Smalle straten, water aan twee kanten."}, {"title": "Jamaica Beach", "note": "Helder, ondiep water aan de punt. Rotsplaten, niet zand — zwemmen als in een bad."}]}, {"id": " const ISOLA = {"x": 132.31, "y": 418.83};
const FILTERS = [{id:"all",label:"Alle"},{id:"noord",label:"Noord"},{id:"west",label:"West"},{id:"oost",label:"Oost"},{id:"zuid",label:"Zuid"}];
let filter = "all";
let selectedId = "sirmione";

function visibleTowns() {
  return filter === "all" ? TOWNS : TOWNS.filter(t => t.shore === filter);
}
function selected() {
  return TOWNS.find(t => t.id === selectedId) || TOWNS[0];
}
function pick(id) {
  selectedId = id;
  const town = TOWNS.find(t => t.id === id);
  if (town && filter !== "all" && town.shore !== filter) filter = "all";
  render();
  if (window.matchMedia("(max-width:899px)").matches) {
    document.getElementById("detail").scrollIntoView({behavior:"smooth", block:"start"});
  }
}
function renderMap() {
  const vis = new Set(visibleTowns().map(t => t.id));
  const pins = TOWNS.map(town => {
    const dim = vis.has(town.id) ? "1" : ".25";
    const active = town.id === selectedId;
    const labelX = town.labelSide === "left" ? town.x - 12 : town.x + 12;
    const anchor = town.labelSide === "left" ? "end" : "start";
    return `<g style="opacity:${dim}">
      <text x="${labelX}" y="${town.y + 3.5}" text-anchor="${anchor}" font-family="Figtree,sans-serif" font-size="${active?11.5:10.5}" font-weight="${active?600:500}" fill="var(--ink)">${town.name}</text>
      <circle cx="${town.x}" cy="${town.y}" r="${active?18:14}" fill="transparent" style="cursor:pointer" onclick="pick('${town.id}')">
        <title>${town.name}</title>
      </circle>
      <circle cx="${town.x}" cy="${town.y}" r="${active?7:5}" fill="${active?'var(--pin)':'var(--surface)'}" stroke="${active?'var(--pin)':'var(--ink)'}" stroke-width="${active?2:1.6}" pointer-events="none"/>
    </g>`;
  }).join("");
  document.getElementById("map").innerHTML = `
    <rect width="440" height="666.61" fill="var(--bg)"/>
    <path d="${LAKE_PATH}" fill="var(--water)" stroke="var(--water-deep)" stroke-width="1.4" stroke-linejoin="round"/>
    <ellipse cx="${ISOLA.x}" cy="${ISOLA.y}" rx="7.5" ry="4.2" fill="var(--land)" stroke="var(--water-deep)" stroke-width=".8"/>
    <text x="${ISOLA.x-22}" y="${ISOLA.y-10}" fill="var(--water-deep)" font-family="Figtree,sans-serif" font-size="9" font-weight="500">Isola</text>
    ${pins}`;
}
function renderFilters() {
  document.getElementById("filters").innerHTML = FILTERS.map(f =>
    `<button class="chip" type="button" aria-pressed="${f.id===filter}" onclick="setFilter('${f.id}')">${f.label}</button>`
  ).join("");
}
function setFilter(id) { filter = id; render(); }
function renderList() {
  document.getElementById("list").innerHTML = visibleTowns().map(t =>
    `<li><button type="button" class="${t.id===selectedId?'active':''}" onclick="pick('${t.id}')">
      <span class="name">${t.name}</span>
      <span class="sub">${SHORE_LABEL[t.shore]} · ${t.tag}</span>
    </button></li>`
  ).join("");
}
function renderDetail() {
  const t = selected();
  document.getElementById("detail").innerHTML = `
    <p class="kicker">${SHORE_LABEL[t.shore]}oever</p>
    <h2>${t.name}</h2>
    <p class="tag">${t.tag}</p>
    <ol>${t.things.map((th,i)=>`<li><span class="num">${i+1}</span><div><h3 style="margin:0;font-size:16px;font-family:var(--font-sans);font-weight:500;letter-spacing:0">${th.title}</h3><p class="note">${th.note}</p></div></li>`).join("")}</ol>`;
}
function render() { renderMap(); renderFilters(); renderList(); renderDetail(); }
render();
</script>
</body>
